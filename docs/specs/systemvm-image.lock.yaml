# Pinned System VM boot image for Phase 1 (WOR-27 / GH #12).
# Read by: src/systemvm.rs (load_image_lock, verify_image, launch_config_from_lock) via
#          systemvmctl lock-env / verify-image / launch-config --from-lock,
#          scripts/systemvm/fetch-image.sh, .github/workflows/systemvm-image.yml.
# Change procedure: docs/process/systemvm-bringup.md, "Bumping the pinned image".
schema_version: 5
distribution: alpine
branch: v3.22
release: 3.22.8
arch: aarch64
flavor: virt
kernel_version: 6.12.115-0-virt
source:
  # The "Virtual" ISO: kernel, initramfs, modloop and base apks in one ISO 9660 image.
  url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-virt-3.22.8-aarch64.iso
  sha256: dd3cec79d32a726d40bace8fc97c2d04f58d7da9dd9084e62a817ed6228181b7
  size_bytes: 80646144
  published: "2026-11-05"
artifacts:
  kernel:
    member: boot/vmlinuz-virt
    member_sha256: ebf299aa6829b15166008db24b076ac0a8b3e778c72ed66be488742aaf05d741
    # Alpine ships the arm64 kernel as an EFI zboot PE wrapping a gzip payload; Virtualization.framework
    # needs the raw ARM64 Image inside it (scripts/systemvm/unpack-zboot.py).
    unpack: zboot-gzip
    file: Image-virt
    sha256: ee66670649107e2efe319a436c9b9caf84b093d471f73577d54292e5c081b80b
    format: raw ARM64 Linux Image (magic ARM\x64 at offset 56), uncompressed
  initrd:
    member: boot/initramfs-virt
    member_sha256: 274289d30bee817d46e285cf4054f7a0e016c93feafd1763066a95f695b88ba0
    unpack: none
    file: initramfs-virt
    sha256: 274289d30bee817d46e285cf4054f7a0e016c93feafd1763066a95f695b88ba0
    format: gzip-compressed cpio initramfs
# The ISO itself is attached read-only as the first virtio block device so the initramfs finds its
# boot media (modloop and apks) without network access.
boot_media:
  file: alpine-virt-3.22.8-aarch64.iso
  sha256: dd3cec79d32a726d40bace8fc97c2d04f58d7da9dd9084e62a817ed6228181b7
# Overlay (ADR 0002): systemvm/overlay plus the pinned packages are packed into localhost.apkovl.tar.gz,
# appended to the pinned initramfs as a second cpio archive (build/systemvm/initramfs-vesper) and selected
# with apkovl= on the kernel command line, so the pinned ISO stays untouched.
overlay:
  dir: systemvm/overlay
  packages_lock: docs/specs/systemvm-packages.lock.yaml
  apkovl_path: /vesper/localhost.apkovl.tar.gz
  file: initramfs-vesper
# Control channel (GH #13): the launcher serves <bridge_dir>/<cid>.sock on the host; a client writes
# "CONNECT <port>\n" and is relayed to that guest vsock port (the vesper-proxy bridge convention). The guest
# agent (systemvm/overlay/usr/local/bin/vesper-agent, supervised by etc/init.d/vesper-agent) listens on agent_port.
control:
  bridge_dir: run/systemvm/vsock
  cid: 3
  agent_port: 1024
boot:
  # From boot/grub/grub.cfg on the ISO, with the console moved to the virtio console (hvc0), plus the overlay.
  kernel_cmdline: "console=hvc0 modules=loop,squashfs,sd-mod,usb-storage apkovl=/vesper/localhost.apkovl.tar.gz"
  # Console text that marks a healthy boot: the getty prompt on hvc0.
  ready_pattern: "login:"
  # Boot-time threshold (GH #12 "boot time within acceptable threshold"), agreed 2026-11-06: 5 s to ready_pattern.
  max_boot_ms: 5000
  # Console-driven guest probe (GH #12 "NAT networking is functional from guest"): the launcher logs in as root
  # (the live ISO has no root password), configures eth0 over DHCP from the Virtualization.framework NAT, pings the
  # NAT gateway, prints the success marker, then powers off so the VM stops cleanly. The marker is split in the
  # typed command ("VESPER-NAT-"OK) because the console echoes input; only real output contains VESPER-NAT-OK.
  probe:
    login_user: root
    shell_prompt: "~# "
    commands:
      - "ip link set eth0 up && udhcpc -i eth0 -n -q -t 10"
      - "ip -4 addr show eth0 | grep -q 'inet ' && ping -c 1 -W 3 \"$(ip route | awk '/^default/ {print $3; exit}')\" > /dev/null && touch /run/vesper-nat-ok && echo \"VESPER-NAT-\"OK"
      - "for i in $(seq 1 90); do [ -f /run/vesper/packages-ready ] && break; sleep 1; done; test -f /run/vesper/packages-ready && command -v socat >/dev/null && command -v containerd >/dev/null && command -v dockerd >/dev/null && echo \"VESPER-EXTRAS-\"OK"
      - "for i in $(seq 1 30); do rc-service vesper-agent status 2>/dev/null | grep -q started && break; sleep 1; done; rc-service vesper-agent status | grep -q started && echo \"VESPER-AGENT-\"OK"
      - "for i in $(seq 1 60); do [ -f /run/vesper/services-ready ] && break; sleep 1; done; rc-service containerd status | grep -q started && rc-service docker status | grep -q started && docker version --format '{{.Server.Version}}' >/dev/null 2>&1 && echo \"VESPER-SERVICES-\"OK"
      - "test -f /run/vesper-nat-ok && test -f /run/vesper/packages-ready && test -f /run/vesper/services-ready && rc-service vesper-agent status | grep -q started && echo \"VESPER-PROBE-\"OK"
    success_pattern: "VESPER-PROBE-OK"
    shutdown_command: poweroff
# sha256("<kernel_sha256>:<rootfs or empty>:<initrd_sha256>:<boot_media_sha256>") as computed by
# systemvm::build_manifest. systemvmctl verify-image fails if the fetched artifacts do not produce it.
expected_image_id: b1965de508d579c75a9f55c761a9114d42e6220a81d0d101517733ff546e8abe
