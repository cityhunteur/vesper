  # PATCH /pmem/{id}
  'PATCH /pmem/{id}#preboot_invalid_state':
    setup: ['@pmem0']
    request: 'PATCH /pmem/pmem0 {"id":"pmem0"}'
  'PATCH /pmem/{id}#patch_rate_limiter_runtime':
    setup: ['@pmem0', '@boot']
    request: 'PATCH /pmem/pmem0 {"id":"pmem0","rate_limiter":{"bandwidth":{"size":1024,"refill_time":100}}}'
  'PATCH /pmem/{id}#id_mismatch_runtime':
    setup: ['@boot']
    request: 'PATCH /pmem/pmem0 {"id":"other"}'
  'PATCH /pmem/{id}#missing_device_runtime':
    setup: ['@boot']
    request: 'PATCH /pmem/pmem0 {"id":"pmem0","rate_limiter":{"bandwidth":{"size":1024,"refill_time":100}}}'
  'PATCH /pmem/{id}#missing_device_without_rate_limiter_runtime':
    setup: ['@boot']
    request: 'PATCH /pmem/pmem0 {"id":"pmem0"}'

  # PATCH /vm
  'PATCH /vm#pause_preboot':
    request: 'PATCH /vm {"state":"Paused"}'
  'PATCH /vm#pause_runtime':
    setup: ['@boot']
    request: 'PATCH /vm {"state":"Paused"}'
  'PATCH /vm#resume_runtime':
    setup: ['@boot', '@pause']
    request: 'PATCH /vm {"state":"Resumed"}'

  # PUT /actions
  'PUT /actions#flush_metrics_preboot':
    request: 'PUT /actions {"action_type":"FlushMetrics"}'
  'PUT /actions#flush_metrics_postboot':
    setup: ['@metrics', '@boot']
    request: 'PUT /actions {"action_type":"FlushMetrics"}'
  'PUT /actions#instance_start_preboot_missing_kernel':
    request: 'PUT /actions {"action_type":"InstanceStart"}'
  'PUT /actions#instance_start_pmem_missing_backing_file':
