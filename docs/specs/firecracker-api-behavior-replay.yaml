    request: 'PATCH /mmds {"meta":{"extra":"x"}}'
  'PATCH /mmds#runtime_missing_config':
    setup: ['@mmds_store', '@boot']
    request: 'PATCH /mmds {"meta":{"extra":"x"}}'
  'PATCH /mmds#oversized_merge_patch':
    setup: ['PUT /mmds {"a":"{pad:30000}"}']
    request: 'PATCH /mmds {"b":"{pad:30000}"}'

