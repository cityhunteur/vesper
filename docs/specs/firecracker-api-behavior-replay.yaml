# Replay scripts for the behaviour matrix (ADR 0007 slice 6).
#
# One script per case of docs/generated/firecracker-api-behavior-matrix.json, keyed `METHOD PATH#case_id`. Each
# case runs on a fresh microVM: the `setup` steps in order (each must return 2xx), then `request`, whose response is
# judged against the case. `src/api_replay.rs` reads this file; `make behavior-replay-check` (tests/api_replay.rs)
# checks that it covers the matrix exactly and replays it on the model; `make systemvm-replay-suite` on Backend A.
#
# Step forms: `METHOD /path [JSON]`, `WAIT <ms>`, `@macro`. `{root}` is the case's root: a temporary directory on the
# model backend and the jail on Backend A (empty, so `{root}/tmp/x` is `/tmp/x` there); it is removed from response
# bodies before judging. `{pad:N}` is N letters `a`; `{rep:N:TEXT}` is N copies of TEXT.
#
# Every case's microVM can open the tap devices in `taps` (on Backend A, `vesperd --tap`, CE-0010), as on the
# reference host the captures came from; every `host_dev_name` a script names is listed there.
#
# Every case root holds `files`, the kernel at `{root}/Image` and the initramfs at `{root}/initrd.gz`. Cases marked
# `snapshot: true` also hold the snapshot fixture at `{root}/snap/vm.vmstate` and `{root}/snap/vm.mem`: the
# `snapshot_fixture` steps run once and leave a paused microVM's snapshot at `{root}/tmp/fixture.vmstate` and
# `{root}/tmp/fixture.mem`, which the backend gives to those cases.

version: 1
firecracker_revision: d83d72b710361a10294480131377b1b00b163af8

files:
  - { path: /tmp/rootfs.ext4, bytes: 1048576 }
  - { path: /tmp/rootfs-updated.ext4, bytes: 1048576 }
  - { path: /tmp/data.ext4, bytes: 1048576 }
  - { path: /tmp/pmem.img, bytes: 2097152 }
  - { path: /tmp/pmem-empty.img, bytes: 0 }
  - { path: /tmp/fc.log, bytes: 0 }
  - { path: /tmp/fc.metrics, bytes: 0 }
  - { path: /tmp/serial.out, bytes: 0 }

taps: [tap0, tap1]

macros:
  boot_source:
    - 'PUT /boot-source {"kernel_image_path":"{root}/Image","initrd_path":"{root}/initrd.gz","boot_args":"console=ttyS0 reboot=k panic=1 pci=off"}'
  start:
    - 'PUT /actions {"action_type":"InstanceStart"}'
  boot:
    - '@boot_source'
    - '@start'
  # The balloon and virtio-mem devices activate only when the guest driver probes them, a moment after
  # InstanceStart; until then Firecracker answers "Device not activated yet" or "Device is not active".
  boot_settled:
    - '@boot'
    - 'WAIT 2000'
  pause:
    - 'PATCH /vm {"state":"Paused"}'
  machine_512:
    - 'PUT /machine-config {"vcpu_count":1,"mem_size_mib":256}'
    - 'PATCH /machine-config {"vcpu_count":2,"mem_size_mib":512,"track_dirty_pages":true}'
  balloon_min:
    - 'PUT /balloon {"amount_mib":1,"deflate_on_oom":true}'
  balloon_stats:
    - 'PUT /balloon {"amount_mib":1,"deflate_on_oom":true,"stats_polling_interval_s":1}'
  balloon_hinting:
    - 'PUT /balloon {"amount_mib":1,"deflate_on_oom":true,"free_page_hinting":true}'
  mmds_store:
    - 'PUT /mmds {"meta":{"name":"vesper","version":"1"}}'
  net0:
    - 'PUT /network-interfaces/eth0 {"iface_id":"eth0","host_dev_name":"tap0","guest_mac":"06:00:ac:10:00:02"}'
  mmds_config:
    - 'PUT /mmds/config {"network_interfaces":["eth0"],"version":"V1","ipv4_address":"169.254.169.254"}'
  rootfs:
    - 'PUT /drives/rootfs {"drive_id":"rootfs","path_on_host":"{root}/tmp/rootfs.ext4","is_root_device":true,"is_read_only":false}'
  pmem0:
    - 'PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/pmem.img"}'
  hotplug:
    - 'PUT /hotplug/memory {"total_size_mib":1024}'
  vsock:
    - 'PUT /vsock {"guest_cid":5,"uds_path":"{root}/tmp/vesper-vsock.sock"}'
  logger:
    - 'PUT /logger {"log_path":"{root}/tmp/fc.log","level":"Info"}'
  metrics:
    - 'PUT /metrics {"metrics_path":"{root}/tmp/fc.metrics"}'
  serial:
    - 'PUT /serial {"serial_out_path":"{root}/tmp/serial.out"}'
  entropy:
    - 'PUT /entropy {"rate_limiter":{"bandwidth":{"size":4096,"refill_time":1000,"one_time_burst":512},"ops":{"size":32,"refill_time":100}}}'
  cpu_config:
    - 'PUT /cpu-config {}'

snapshot_fixture:
  - '@vsock'
  - '@boot'
  - '@pause'
  - 'PUT /snapshot/create {"snapshot_type":"Full","snapshot_path":"{root}/tmp/fixture.vmstate","mem_file_path":"{root}/tmp/fixture.mem"}'

cases:
  # GET /
  'GET /#preboot_instance_info':
    request: 'GET /'
  'GET /#paused_after_snapshot_load':
    snapshot: true
    setup: ['PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}']
    request: 'GET /'
  'GET /#running_after_snapshot_load_resume':
    snapshot: true
    setup: ['PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"},"resume_vm":true}']
    request: 'GET /'

  # GET /balloon
  'GET /balloon#preboot_missing_device':
    request: 'GET /balloon'
  'GET /balloon#preboot_configured_defaults':
    setup: ['@balloon_min']
    request: 'GET /balloon'
  'GET /balloon#runtime_missing_device':
    setup: ['@boot']
    request: 'GET /balloon'
  'GET /balloon#runtime_updated_target':
    setup: ['@balloon_min', '@boot_settled', 'PATCH /balloon {"amount_mib":64}']
    request: 'GET /balloon'

  # GET /balloon/hinting/status
  'GET /balloon/hinting/status#preboot_invalid_state':
    request: 'GET /balloon/hinting/status'
  'GET /balloon/hinting/status#missing_device_runtime':
    setup: ['@boot']
    request: 'GET /balloon/hinting/status'
  'GET /balloon/hinting/status#hinting_disabled_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'GET /balloon/hinting/status'
  'GET /balloon/hinting/status#idle_status_runtime':
    setup: ['@balloon_hinting', '@boot_settled']
    request: 'GET /balloon/hinting/status'

  # GET /balloon/statistics
  'GET /balloon/statistics#preboot_invalid_state':
    request: 'GET /balloon/statistics'
  'GET /balloon/statistics#missing_device_runtime':
    setup: ['@boot']
    request: 'GET /balloon/statistics'
  'GET /balloon/statistics#stats_disabled_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'GET /balloon/statistics'
  'GET /balloon/statistics#enabled_stats_runtime':
    # A 256 MiB guest, so the balloon can reach its 64 MiB target (a 128 MiB guest stops near 52 MiB).
