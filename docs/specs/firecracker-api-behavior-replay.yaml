  'PUT /entropy#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /entropy {"rate_limiter":{"bandwidth":{"size":4096,"refill_time":1000,"one_time_burst":512},"ops":{"size":32,"refill_time":100}}}'

  # PUT /hotplug/memory
  'PUT /hotplug/memory#put_valid_preboot':
    request: 'PUT /hotplug/memory {"total_size_mib":1024}'
  'PUT /hotplug/memory#invalid_block_size_preboot':
    request: 'PUT /hotplug/memory {"total_size_mib":1024,"block_size_mib":3}'
  'PUT /hotplug/memory#invalid_total_size_preboot':
    request: 'PUT /hotplug/memory {"total_size_mib":100}'
  'PUT /hotplug/memory#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /hotplug/memory {"total_size_mib":1024}'

  # PUT /logger
  'PUT /logger#put_valid_any':
    request: 'PUT /logger {"log_path":"{root}/tmp/fc.log","level":"Info"}'
  'PUT /logger#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /logger {"log_path":"{root}/tmp/fc.log","level":"Info"}'

  # PUT /machine-config
  'PUT /machine-config#put_valid_preboot':
    request: 'PUT /machine-config {"vcpu_count":2,"mem_size_mib":256}'
  'PUT /machine-config#shrink_below_balloon_target_preboot':
    setup: ['PUT /balloon {"amount_mib":100,"deflate_on_oom":true}']
    request: 'PUT /machine-config {"vcpu_count":1,"mem_size_mib":64}'

  # PUT /metrics
  'PUT /metrics#put_valid_any':
    request: 'PUT /metrics {"metrics_path":"{root}/tmp/fc.metrics"}'
  'PUT /metrics#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /metrics {"metrics_path":"{root}/tmp/fc.metrics"}'
  'PUT /metrics#duplicate_init':
    setup: ['@metrics']
    request: 'PUT /metrics {"metrics_path":"{root}/tmp/fc.metrics"}'

  # PUT /mmds
  'PUT /mmds#put_valid_store':
    request: 'PUT /mmds {"meta":{"name":"vesper","version":"1"}}'
  'PUT /mmds#runtime_missing_config':
    setup: ['@boot']
    request: 'PUT /mmds {"meta":{"name":"vesper","version":"1"}}'
  'PUT /mmds#oversized_store':
    # Under the 51200-byte HTTP limit, but `1e2` serializes as `100.0`: about 72 kB in the store (to_vec length).
    request: 'PUT /mmds {"a":[{rep:12000:1e2,}0]}'

  # PUT /mmds/config
  'PUT /mmds/config#put_valid_preboot':
    setup: ['@net0']
    request: 'PUT /mmds/config {"network_interfaces":["eth0"],"version":"V1","ipv4_address":"169.254.169.254"}'
  'PUT /mmds/config#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /mmds/config {"network_interfaces":["eth0"]}'
  'PUT /mmds/config#empty_network_interface_list_preboot':
    request: 'PUT /mmds/config {"network_interfaces":[]}'
  'PUT /mmds/config#unknown_network_interface_preboot':
    request: 'PUT /mmds/config {"network_interfaces":["eth9"]}'
  'PUT /mmds/config#invalid_ipv4_address_preboot':
    request: 'PUT /mmds/config {"network_interfaces":["eth0"],"ipv4_address":"10.0.0.1"}'

  # PUT /network-interfaces/{iface_id}
  'PUT /network-interfaces/{iface_id}#postboot_pci_not_enabled':
    setup: ['@boot']
    request: 'PUT /network-interfaces/eth0 {"iface_id":"eth0","host_dev_name":"tap0","guest_mac":"06:00:ac:10:00:02"}'
  'PUT /network-interfaces/{iface_id}#id_mismatch_preboot':
    request: 'PUT /network-interfaces/eth0 {"iface_id":"eth1","host_dev_name":"tap0"}'
  'PUT /network-interfaces/{iface_id}#put_valid_preboot':
    request: 'PUT /network-interfaces/eth0 {"iface_id":"eth0","host_dev_name":"tap0","guest_mac":"06:00:ac:10:00:02"}'
  'PUT /network-interfaces/{iface_id}#duplicate_guest_mac_preboot':
    setup: ['@net0']
    request: 'PUT /network-interfaces/eth1 {"iface_id":"eth1","host_dev_name":"tap1","guest_mac":"06:00:ac:10:00:02"}'
  'PUT /network-interfaces/{iface_id}#duplicate_host_dev_name_preboot':
    setup: ['@net0']
    request: 'PUT /network-interfaces/eth1 {"iface_id":"eth1","host_dev_name":"tap0"}'
  'PUT /network-interfaces/{iface_id}#mtu_below_minimum_preboot':
    request: 'PUT /network-interfaces/eth0 {"iface_id":"eth0","host_dev_name":"tap0","mtu":67}'
  'PUT /network-interfaces/{iface_id}#mtu_bounds_preboot':
    setup: ['PUT /network-interfaces/eth0 {"iface_id":"eth0","host_dev_name":"tap0","mtu":68}']
    request: 'PUT /network-interfaces/eth1 {"iface_id":"eth1","host_dev_name":"tap1","mtu":65535}'

  # PUT /pmem/{id}
  'PUT /pmem/{id}#postboot_pci_not_enabled':
    setup: ['@boot']
    request: 'PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/pmem.img"}'
  'PUT /pmem/{id}#put_valid_preboot':
    request: 'PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/pmem.img"}'
  'PUT /pmem/{id}#missing_backing_file_stored':
    request: 'PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/missing-pmem.img"}'
  'PUT /pmem/{id}#put_with_rate_limiter_preboot':
    request: 'PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/pmem.img","rate_limiter":{"bandwidth":{"size":1024,"refill_time":100},"ops":{"size":10,"refill_time":100}}}'
  'PUT /pmem/{id}#block_root_conflict_preboot':
    setup: ['@rootfs']
    request: 'PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/pmem.img","root_device":true}'
  'PUT /pmem/{id}#duplicate_pmem_root_preboot':
    setup: ['PUT /pmem/pmem0 {"id":"pmem0","path_on_host":"{root}/tmp/pmem.img","root_device":true}']
    request: 'PUT /pmem/pmem1 {"id":"pmem1","path_on_host":"{root}/tmp/pmem.img","root_device":true}'

  # PUT /serial
  'PUT /serial#put_valid_any':
    request: 'PUT /serial {"serial_out_path":"{root}/tmp/serial.out"}'
  'PUT /serial#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /serial {"serial_out_path":"{root}/tmp/serial.out"}'
  'PUT /serial#put_with_rate_limiter_any':
    request: 'PUT /serial {"serial_out_path":"{root}/tmp/serial.out","rate_limiter":{"size":1024,"refill_time":100}}'

  # PUT /snapshot/create
  'PUT /snapshot/create#preboot_invalid_state':
    request: 'PUT /snapshot/create {"snapshot_type":"Full","snapshot_path":"{root}/tmp/s.vmstate","mem_file_path":"{root}/tmp/s.mem"}'
  'PUT /snapshot/create#running_requires_paused':
    setup: ['@boot']
    request: 'PUT /snapshot/create {"snapshot_type":"Full","snapshot_path":"{root}/tmp/s.vmstate","mem_file_path":"{root}/tmp/s.mem"}'
  'PUT /snapshot/create#paused_returns_no_content':
    setup: ['@boot', '@pause']
    request: 'PUT /snapshot/create {"snapshot_type":"Full","snapshot_path":"{root}/tmp/s.vmstate","mem_file_path":"{root}/tmp/s.mem"}'

  # PUT /snapshot/load
  'PUT /snapshot/load#missing_memory_source':
    snapshot: true
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate"}'
  'PUT /snapshot/load#too_many_memory_sources':
    snapshot: true
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_file_path":"{root}/snap/vm.mem","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#allowed_after_logger_metrics_and_serial_returns_no_content':
    snapshot: true
    setup: ['@logger', '@metrics', '@serial']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#allowed_with_resume_vm_returns_no_content':
    snapshot: true
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"},"resume_vm":true}'
  'PUT /snapshot/load#blocked_after_boot_source':
    snapshot: true
    setup: ['@boot_source']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#blocked_after_memory_hotplug':
    snapshot: true
    setup: ['@hotplug']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#allowed_after_cpu_config_returns_no_content':
    snapshot: true
    setup: ['@cpu_config']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#blocked_after_entropy':
    snapshot: true
    setup: ['@entropy']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#blocked_after_vsock':
    snapshot: true
    setup: ['@vsock']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#blocked_after_mmds_config':
    snapshot: true
    setup: ['@net0', '@mmds_config']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#blocked_after_balloon':
    snapshot: true
    setup: ['@balloon_min']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#blocked_after_network_interface':
    snapshot: true
    setup: ['@net0']
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"}}'
  'PUT /snapshot/load#vsock_override_accepted':
    snapshot: true
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"},"vsock_override":{"uds_path":"{root}/tmp/override.sock"}}'
  'PUT /snapshot/load#clock_realtime_x86_64':
    snapshot: true
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"},"clock_realtime":true}'
  'PUT /snapshot/load#clock_realtime_aarch64':
    snapshot: true
    request: 'PUT /snapshot/load {"snapshot_path":"{root}/snap/vm.vmstate","mem_backend":{"backend_type":"File","backend_path":"{root}/snap/vm.mem"},"clock_realtime":true}'

  # PUT /vsock
  'PUT /vsock#put_valid_preboot':
    request: 'PUT /vsock {"guest_cid":5,"uds_path":"{root}/tmp/vesper-vsock.sock"}'
  'PUT /vsock#low_guest_cid_accepted_preboot':
    request: 'PUT /vsock {"guest_cid":2,"uds_path":"{root}/tmp/vesper-vsock.sock"}'
  'PUT /vsock#postboot_invalid_state':
    setup: ['@boot']
    request: 'PUT /vsock {"guest_cid":5,"uds_path":"{root}/tmp/vesper-vsock.sock"}'
