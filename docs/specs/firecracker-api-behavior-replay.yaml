  'GET /vm/config#metrics_omitted_runtime':
    setup: ['@metrics', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#logger_omitted_preboot':
    setup: ['@logger']
    request: 'GET /vm/config'
  'GET /vm/config#logger_omitted_runtime':
    setup: ['@logger', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#memory_hotplug_export_preboot':
    setup: ['@hotplug']
    request: 'GET /vm/config'
  'GET /vm/config#memory_hotplug_export_runtime':
    setup: ['@hotplug', '@boot_settled']
    request: 'GET /vm/config'
  'GET /vm/config#mmds_config_export_preboot':
    setup: ['@net0', '@mmds_config']
    request: 'GET /vm/config'
  'GET /vm/config#mmds_config_export_runtime':
    setup: ['@net0', '@mmds_config', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#vsock_export_preboot':
    setup: ['@vsock']
    request: 'GET /vm/config'
  'GET /vm/config#vsock_export_runtime':
    setup: ['@vsock', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#network_interfaces_export_preboot':
    setup: ['@net0']
    request: 'GET /vm/config'
  'GET /vm/config#network_interfaces_export_runtime':
    setup: ['@net0', '@boot', 'PATCH /network-interfaces/eth0 {"iface_id":"eth0","rx_rate_limiter":{"bandwidth":{"size":1024,"refill_time":100}}}']
    request: 'GET /vm/config'
  'GET /vm/config#balloon_export_preboot':
    setup: ['@balloon_min']
    request: 'GET /vm/config'
  'GET /vm/config#balloon_export_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'GET /vm/config'
  'GET /vm/config#entropy_export_preboot':
    setup: ['@entropy']
    request: 'GET /vm/config'
  'GET /vm/config#entropy_export_runtime':
    setup: ['@entropy', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#boot_source_export_preboot':
    setup: ['@boot_source']
    request: 'GET /vm/config'
  'GET /vm/config#boot_source_export_runtime':
    setup: ['@boot']
    request: 'GET /vm/config'
  'GET /vm/config#pmem_export_preboot':
    setup: ['@pmem0']
    request: 'GET /vm/config'
  'GET /vm/config#pmem_export_runtime':
    setup: ['@pmem0', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#drives_export_preboot_root_first':
    setup: ['PUT /drives/data {"drive_id":"data","path_on_host":"{root}/tmp/data.ext4","is_root_device":false,"is_read_only":false}', '@rootfs']
    request: 'GET /vm/config'
  'GET /vm/config#drives_export_preboot_default_cache_type':
    setup: ['@rootfs']
    request: 'GET /vm/config'
  'GET /vm/config#drives_export_runtime_after_patch':
    setup: ['@rootfs', '@boot', 'PATCH /drives/rootfs {"drive_id":"rootfs","path_on_host":"{root}/tmp/rootfs-updated.ext4"}']
    request: 'GET /vm/config'

  # PATCH /balloon
  'PATCH /balloon#preboot_invalid_state':
    request: 'PATCH /balloon {"amount_mib":1}'
  'PATCH /balloon#missing_device_runtime':
    setup: ['@boot']
    request: 'PATCH /balloon {"amount_mib":1}'
  'PATCH /balloon#update_existing_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'PATCH /balloon {"amount_mib":64}'
  'PATCH /balloon#oversize_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'PATCH /balloon {"amount_mib":256}'

  # PATCH /balloon/hinting/start
  'PATCH /balloon/hinting/start#preboot_invalid_state':
    request: 'PATCH /balloon/hinting/start'
  'PATCH /balloon/hinting/start#missing_device_runtime':
    setup: ['@boot']
    request: 'PATCH /balloon/hinting/start'
  'PATCH /balloon/hinting/start#hinting_disabled_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'PATCH /balloon/hinting/start'
  'PATCH /balloon/hinting/start#start_success_runtime':
    setup: ['@balloon_hinting', '@boot_settled']
    request: 'PATCH /balloon/hinting/start'

  # PATCH /balloon/hinting/stop
  'PATCH /balloon/hinting/stop#preboot_invalid_state':
    request: 'PATCH /balloon/hinting/stop'
  'PATCH /balloon/hinting/stop#missing_device_runtime':
    setup: ['@boot']
    request: 'PATCH /balloon/hinting/stop'
  'PATCH /balloon/hinting/stop#hinting_disabled_runtime':
    setup: ['@balloon_min', '@boot_settled']
    request: 'PATCH /balloon/hinting/stop'
  'PATCH /balloon/hinting/stop#stop_success_runtime':
    setup: ['@balloon_hinting', '@boot_settled']
    request: 'PATCH /balloon/hinting/stop'

  # PATCH /balloon/statistics
  'PATCH /balloon/statistics#preboot_invalid_state':
    request: 'PATCH /balloon/statistics {"stats_polling_interval_s":2}'
  'PATCH /balloon/statistics#missing_device_runtime':
    setup: ['@boot']
    request: 'PATCH /balloon/statistics {"stats_polling_interval_s":2}'
  'PATCH /balloon/statistics#update_existing_runtime':
    setup: ['@balloon_stats', '@boot_settled']
    request: 'PATCH /balloon/statistics {"stats_polling_interval_s":2}'
  'PATCH /balloon/statistics#disable_runtime':
    setup: ['@balloon_stats', '@boot_settled']
    request: 'PATCH /balloon/statistics {"stats_polling_interval_s":0}'

  # PATCH /drives/{drive_id}
  'PATCH /drives/{drive_id}#preboot_invalid_state':
    setup: ['@rootfs']
    request: 'PATCH /drives/rootfs {"drive_id":"rootfs","path_on_host":"{root}/tmp/rootfs-updated.ext4"}'
  'PATCH /drives/{drive_id}#id_mismatch_runtime':
    setup: ['@rootfs', '@boot']
    request: 'PATCH /drives/rootfs {"drive_id":"other","path_on_host":"{root}/tmp/rootfs-updated.ext4"}'
  'PATCH /drives/{drive_id}#missing_drive_runtime':
    setup: ['@boot']
    request: 'PATCH /drives/data {"drive_id":"data","path_on_host":"{root}/tmp/data.ext4"}'
  'PATCH /drives/{drive_id}#update_existing_runtime':
    setup: ['@rootfs', '@boot']
    request: 'PATCH /drives/rootfs {"drive_id":"rootfs","path_on_host":"{root}/tmp/rootfs-updated.ext4"}'

  # PATCH /hotplug/memory
  'PATCH /hotplug/memory#preboot_invalid_state':
    request: 'PATCH /hotplug/memory {"requested_size_mib":512}'
  'PATCH /hotplug/memory#patch_valid_runtime':
    setup: ['@hotplug', '@boot_settled']
    request: 'PATCH /hotplug/memory {"requested_size_mib":512}'
  'PATCH /hotplug/memory#invalid_requested_size_runtime':
