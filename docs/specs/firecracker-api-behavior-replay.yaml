  # GET /hotplug/memory
  'GET /hotplug/memory#preboot_invalid_state':
    request: 'GET /hotplug/memory'
  'GET /hotplug/memory#runtime_initial_status':
    setup: ['@hotplug', '@boot_settled']
    request: 'GET /hotplug/memory'
  'GET /hotplug/memory#runtime_updated_requested_size':
    setup: ['@hotplug', '@boot_settled', 'PATCH /hotplug/memory {"requested_size_mib":512}']
    request: 'GET /hotplug/memory'

  # GET /machine-config
  'GET /machine-config#preboot_after_put_patch':
    setup: ['@machine_512']
    request: 'GET /machine-config'
  'GET /machine-config#runtime_after_put_patch':
    setup: ['@machine_512', '@boot']
    request: 'GET /machine-config'

  # GET /mmds
  'GET /mmds#preboot_empty_store':
    request: 'GET /mmds'
  'GET /mmds#preboot_initialized_store':
    setup: ['PUT /mmds {"meta":{"name":"vesper"}}', 'PATCH /mmds {"meta":{"version":"1"}}']
    request: 'GET /mmds'
  'GET /mmds#runtime_configured_store':
    setup: ['@mmds_store', '@net0', '@mmds_config', '@boot']
    request: 'GET /mmds'
  'GET /mmds#runtime_missing_config':
    setup: ['@mmds_store', '@boot']
    request: 'GET /mmds'

  # GET /version
  'GET /version#preboot_version_response':
    request: 'GET /version'
  'GET /version#runtime_version_response':
    setup: ['@boot']
    request: 'GET /version'

  # GET /vm/config
  'GET /vm/config#machine_config_export_preboot':
    setup: ['@machine_512']
    request: 'GET /vm/config'
  'GET /vm/config#machine_config_export_runtime':
    setup: ['@machine_512', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#cpu_config_omitted_preboot':
    setup: ['@cpu_config']
    request: 'GET /vm/config'
  'GET /vm/config#serial_omitted_preboot':
    setup: ['@serial']
    request: 'GET /vm/config'
  'GET /vm/config#serial_omitted_runtime':
    setup: ['@serial', '@boot']
    request: 'GET /vm/config'
  'GET /vm/config#metrics_omitted_preboot':
