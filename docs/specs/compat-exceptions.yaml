version: 1
exceptions:
  - id: CE-0001
    owner: cityhunteur
    issue: 21
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-08"
    description: >-
      The upstream Firecracker pytest integration suite has no Linux pass set. Since GH #172 the Backend A run is
      scripted (make systemvm-upstream-suite) and judged by baselinectl --mode upstream-compare against the classes
      in docs/specs/upstream-suite-classes.yaml. Two full runs on 2026-11-13 passed 763 and 756 of 980
      (run/GH-172/20261113T081827Z and 20261113T101748Z). At the time the second left 7 timing results unmatched
      (compare-at-run.txt); the classes were then widened for them and explain its other 224 (96 skip,
      48 environment, 8 test assumption, 72 unexplained, most a VMM memory overshoot or timing under nested
      virtualisation). Because those classes were fitted to that run, a third full run (20261113T133615Z, 757 passed)
      was judged with them frozen: it left 8 unmatched, 4 a harness regression since fixed and 4 load results in
      tests the classes did not name. A fourth run, frozen again, left 7: the memory overshoot in tests no list
      named, and two one-off timeouts. Decision D-031 then made the overshoot class match any test (5.00 to 6.99
      MiB, at most 80) and had the runner rerun alone what matches no class. The fifth full run (20261113T172619Z),
      judged with classes, comparator, collector and runner frozen (run/GH-172/frozen-classes.sha256), was clean:
      759 passed, one of them on the isolated rerun, and 221 explained.
      An earlier feasibility run on 2026-11-12 (GH #166) ran it unmodified in the System VM at the pinned v1.16.0:
      755 of 980 functional and security tests passed, 96 skipped for architecture or kernel reasons, and
      129 failed, errored or hung. Of those, 58 are environment (Apple virtual CPU cache topology, SSB
      reporting, no userfaultfd in the Alpine kernel, no DMI, timing under nested virtualisation), 8 a test
      assumption about the CPU model, 7 a harness gap, and 56 unexplained (52 a VMM memory overshoot of up to
      0.84 MiB over the 5 MiB test threshold). Parity confidence otherwise comes from the vesper-fcparity
      subset. Resolve by producing the pass set on Linux aarch64 (CE-0003) and comparing against it, which
      settles or reclassifies the unexplained classes (decision D-023).
  - id: CE-0002
    owner: cityhunteur
