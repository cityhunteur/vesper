    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-08"
    description: >-
      The upstream Firecracker pytest integration suite is not executed against Backend A yet; parity
      confidence comes from the API conformance subset in vesper-fcparity (version, instance state, machine
      and VM config, pause/resume, full snapshot while paused, deterministic 400 faults, SIGTERM stop) run
      against the stock release binary inside the System VM. Resolve by running the upstream suite at the
      pinned revision inside the System VM (Phase 5 parity gate).
  - id: CE-0002
    owner: cityhunteur
    issue: 21
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-08"
    description: >-
      The Firecracker binaries in the guest are the v1.16.0 release, the first release containing the
      pinned baseline revision 083c4cf69281178acc910f7f857f88e69c51d3b5, not a build of that exact commit
      (TD-029). Resolve by building the pinned commit reproducibly or by moving the lock to the release tag.
  - id: CE-0003
    owner: cityhunteur
    issue: 21
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-08"
    description: >-
      Performance baselines (boot latency p50/p95, sequential create rate) are captured on nested
      virtualization with the System VM's Alpine virt kernel as the microVM kernel; no Linux Firecracker
      baseline on the same host class exists, so the design-v0 "within 20% of Linux" targets cannot be
      evaluated yet. Resolve by capturing a Linux baseline on comparable hardware and pinning a dedicated
      microVM kernel.
