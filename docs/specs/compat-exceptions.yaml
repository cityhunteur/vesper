  - id: CE-0003
    owner: cityhunteur
    issue: 21
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-08"
    description: >-
      Performance baselines (boot latency p50/p95, sequential create rate) are captured on nested
      virtualization with the System VM's Alpine virt kernel as the microVM kernel; no Linux Firecracker
      baseline on the same host class exists, so the design-v0 "within 20% of Linux" targets cannot be
      evaluated yet. Resolve by capturing a Linux baseline on comparable hardware and pinning a dedicated
      microVM kernel.
  - id: CE-0004
    owner: cityhunteur
    issue: 23
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-09"
    description: >-
      Guest exec (WOR-32, ADR 0006) overrides the workload's requested in-guest security posture rather
      than honoring it: shim/internal/bundle/guest.go always grants the full Linux capability set across
      all five sets (including ambient), forces NoNewPrivileges to false, and drops AppArmor/SELinux
      labels, regardless of what the OCI process spec asked for. This deviates from containerd/runc, which
      honor a requested reduced capability set or no-new-privileges. The deviation is intentional because
      the microVM, not the in-guest container, is the isolation boundary (no new namespaces, no second
      seccomp profile). Resolve by either honoring a more restrictive requested posture or confirming the
      full-capability model at the parity-GA security review. Needs human approval before GA (unapproved).
  - id: CE-0006
    owner: cityhunteur
    issue: 156
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-12"
    description: >-
      The in-memory model backend of vesperd (the default until ADR 0007's System VM backend is proven)
      returns error bodies with four fields Firecracker does not send: code, path, method and
      baseline_firecracker_revision, beside Firecracker's fault_message. Clients that compare bodies byte for
      byte see a difference. Resolve when the System VM backend becomes the default (its errors are
      Firecracker's own), or by dropping the extra fields from the model backend.
  - id: CE-0007
    owner: cityhunteur
    issue: 156
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-12"
    description: >-
      vesperd --backend systemvm (ADR 0007 slice 4) relays bytes to Firecracker v1.16.0 under bounds that
      Firecracker itself does not have, and a client can observe them. (1) A connection with no request
      waiting is closed, with no bytes, after 120 s without a byte; Firecracker keeps an idle connection
      open (micro_http has no idle timeout; measured: a direct connection still answered after 125 s).
      (2) A connection whose request has had no reply byte for 120 s is closed with no bytes; Firecracker
      answers however long the operation takes (the slowest measured, PUT /snapshot/create of a 640 MiB
      guest with 512 MiB of it dirtied, under the default 640 MiB memory.max and onto the data disk, took
      1.2 to 2.4 s; slice 5). vesperd infers which side spoke last, so pipelined requests can hit the ceiling
      or escape the idle timeout. (3) More than 16 concurrent connections are closed at once with no bytes;
      Firecracker accepts 10 and answers the 11th to 16th with its own 503 "Too many open connections",
      which vesperd passes through. (4) vesperd's own failures are connection-level: when the bridge, the
      agent or FCAPI fails or does not answer within 5 s, the client connection is closed with no bytes
      where Firecracker would have answered. Every HTTP byte on the socket is Firecracker's own. Resolve
      by confirming or removing each bound at the parity-GA review; the 120 s ceiling is about 50 times
      the slowest create measured at the default memory ceiling.
  - id: CE-0008
    owner: cityhunteur
    issue: 156
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-12"
    description: >-
      vesperd --stage (ADR 0007 section 5, slice 5) hard-links a snapshot memory or vmstate file from the
      store into a fresh jail, owned by root and read-only, so that one store copy serves several restores
      and a microVM cannot change it. Firecracker's PUT /snapshot/create opens its targets for writing with
      truncation (src/vmm/src/persist.rs at the pinned v1.16.0), so a create onto such a linked path fails
      with Firecracker's own 400 "Cannot perform open on the snapshot backing file: Permission denied (os
      error 13)" (or "memory backing file"), where upstream would overwrite the file. A create onto any other
      path in the jail behaves as upstream. Measured by make systemvm-snapshot-suite, step
      create_onto_linked_file_fails. Resolve by accepting it at the parity-GA review (a client writes a new
      snapshot to new paths), or by copying instead of linking.
  - id: CE-0009
    owner: cityhunteur
    issue: 156
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: open
    approved_by: cityhunteur
    approved_on: "2026-11-12"
    description: >-
      On vesperd --backend systemvm (ADR 0007), every path in an API request (kernel_image_path, initrd_path,
      path_on_host, snapshot_path, mem_backend.backend_path, mem_file_path, log_path, metrics_path,
      serial_out_path, uds_path, vsock_override.uds_path) names a file in the microVM's jail, not on the macOS
      host, because Firecracker runs under the jailer inside the System VM. The kernel is /Image and the
      initramfs /initrd.gz; other files reach the jail only through vesperd --stage, vesperd stage or
      Firecracker itself (sockets, snapshots, logs). Responses that echo a path echo the jail path. Measured
      by make systemvm-replay-suite (ADR 0007 slice 6): the 173 behaviour-matrix scripts run with {root}
      empty, so every path is a jail path, and the paths in GET /vm/config and in error messages match the
      matrix with the root removed. Resolve by accepting it at the parity-GA review (a Firecracker client
      that uses the jailer already sends chroot-relative paths), or by translating host paths in vesperd.
  - id: CE-0010
    owner: cityhunteur
    issue: 156
    expiry_date: "2027-03-31"
    target_release: parity-ga
    status: closed
    approved_by: cityhunteur
    approved_on: "2026-11-12"
    description: >-
      Closed (2026-11-13, D-027): vesperd --tap NAME gives the microVM a tap device NAME in its own network
      namespace (jailer --netns), owned by the jailer's uid 20000, so the jailed Firecracker opens it without
      CAP_NET_ADMIN and PUT /network-interfaces answers as upstream; make systemvm-replay-suite passes the 14 cases
      this exception counted (docs/generated/backend-a-behavior-replay.json). The namespace has no uplink; guest
      connectivity beyond its tap is TD-058. Originally: a vesperd microVM could not have a network interface, and
      PUT /network-interfaces failed with Firecracker's own 400 "Open tap device failed: ... Operation not
      permitted (os error 1)", because the jailed Firecracker runs as uid 20000 without CAP_NET_ADMIN and no tap
      device was prepared for it.