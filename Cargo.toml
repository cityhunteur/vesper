[package]
name = "vesper"
version = "0.1.0"
edition = "2024"
description = "Firecracker-compatible microVM control plane for macOS on Apple silicon"
license = "BUSL-1.1"
repository = "https://github.com/cityhunteur/vesper"
readme = "README.md"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
# Structured logs (TD-007; the owner approved tracing-subscriber, D-066). tracing is already linked through axum.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Already built through tokio; used directly for a UDP socket's send buffer (TD-037: macOS limits a datagram to it).
socket2 = "0.6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.23"
tower = "0.5"
