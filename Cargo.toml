[package]
name = "vesper"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.23"
tower = "0.5"
