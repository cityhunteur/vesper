name: Eval on Review

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to evaluate"
        required: true
        type: number

permissions:
  issues: write
  contents: read
  repository-projects: write

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
  PROJECT_NUMBER: "2"
  PROJECT_ID: "PVT_kwHOAFt3k84BQfZi"
  STATUS_FIELD_ID: "PVTSSF_lAHOAFt3k84BQfZizg-mBPk"
  READY_OPTION_ID: "61e4505c"
  DONE_OPTION_ID: "98236657"

jobs:
  eval:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.label.name == 'eval:ready')
    steps:
      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch issue labels
        id: labels
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '.labels[].name' | tr '\n' ',')
          echo "all=$LABELS" >> "$GITHUB_OUTPUT"

          PHASE=$(echo "$LABELS" | grep -oP 'phase:\K[0-9]+' | head -1)
          echo "phase=${PHASE:-none}" >> "$GITHUB_OUTPUT"

          AREA=$(echo "$LABELS" | grep -oP 'area:\K[a-z-]+' | head -1)
          echo "area=${AREA:-none}" >> "$GITHUB_OUTPUT"

          if echo "$LABELS" | grep -q 'epic'; then
            echo "is_epic=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_epic=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run phase-specific eval
        id: eval
        run: |
          PHASE="${{ steps.labels.outputs.phase }}"
          AREA="${{ steps.labels.outputs.area }}"
          IS_EPIC="${{ steps.labels.outputs.is_epic }}"

          if [ "$IS_EPIC" = "true" ]; then
            make test
          elif [ "$PHASE" = "0" ]; then
            case "$AREA" in
              api)
                make contract-test
                cargo test api
                ;;
              platform)
                make validate-entitlements
                cargo test platform
                ;;
              qa)
                make contract-test
                cargo test baseline
                cargo test compat
                ;;
              *)
                make test
                ;;
            esac
          else
            make test
          fi

      - name: Move to Done on success
        if: success()
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"

          ITEM_ID="$(gh project item-list "$PROJECT_NUMBER" --owner "${{ github.repository_owner }}" --limit 200 --format json \
            --jq ".items[] | select(.content.type == \"Issue\" and .content.number == $ISSUE and .content.repository == \"${{ github.repository }}\") | .id" \
            | head -n1)"

          if [ -z "$ITEM_ID" ]; then
            ITEM_ID="$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            ' -f owner="${{ github.repository_owner }}" \
              -f repo="${{ github.event.repository.name }}" \
              -F number="$ISSUE" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" | head -n1)"
          fi

          if [ -n "$ITEM_ID" ]; then
            echo "Moving project item $ITEM_ID to Done"
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" \
              -f itemId="$ITEM_ID" \
              -f fieldId="$STATUS_FIELD_ID" \
              -f optionId="$DONE_OPTION_ID"
          else
            echo "::warning::Issue #$ISSUE not found on project board (PROJECT_TOKEN may be missing project scope)"
          fi

          gh issue edit "$ISSUE" --remove-label "eval:ready" || true
          gh issue comment "$ISSUE" --body "Eval passed in run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Handle failure
        if: failure() && steps.eval.outcome == 'failure'
        run: |
          set -euo pipefail
          ISSUE="${{ steps.issue.outputs.number }}"
          PHASE="${{ steps.labels.outputs.phase }}"
          AREA="${{ steps.labels.outputs.area }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_TITLE="$(gh issue view "$ISSUE" --json title --jq '.title')"

          BUG_NUMBER="$(gh issue list --state open --limit 200 \
            --search "\"[Eval Bug] #${ISSUE}\" in:title" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$BUG_NUMBER" ]; then
            BUG_URL="${{ github.server_url }}/${{ github.repository }}/issues/${BUG_NUMBER}"
          else
            BODY_FILE="$(mktemp)"
            printf '%s\n' \
              "## Summary" \
              "Eval failed for #${ISSUE} due to CI/runtime errors." \
              "" \
              "## Parent issue" \
              "#${ISSUE}" \
              "" \
              "## Eval run" \
              "${RUN_URL}" \
              "" \
              "## Required action" \
              "- Reproduce and fix the failing eval path." \
              "- Add/update tests to prevent recurrence." \
              "- Re-apply label \`eval:ready\` to #${ISSUE} after fix." \
              > "$BODY_FILE"

            CREATE_ARGS=(
              --title "[Eval Bug] #${ISSUE} ${ISSUE_TITLE}"
              --body-file "$BODY_FILE"
              --label bug
              --label kind:roadmap
              --label priority:p1
            )
            if [ "$PHASE" != "none" ]; then
              CREATE_ARGS+=(--label "phase:${PHASE}")
            fi
            if [ "$AREA" != "none" ]; then
              CREATE_ARGS+=(--label "area:${AREA}")
            fi

            BUG_URL="$(gh issue create "${CREATE_ARGS[@]}")"

            BUG_ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "${{ github.repository_owner }}" --url "$BUG_URL" --format json --jq '.id')"
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" \
              -f itemId="$BUG_ITEM_ID" \
              -f fieldId="$STATUS_FIELD_ID" \
              -f optionId="$READY_OPTION_ID"
          fi

          gh issue edit "$ISSUE" --remove-label "eval:ready" || true
          gh issue comment "$ISSUE" --body "Eval failed: ${RUN_URL}. Follow-up bug: ${BUG_URL}."
