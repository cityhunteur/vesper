name: System VM Image

on:
  pull_request:
    paths:
      - docs/specs/systemvm-image.lock.yaml
      - docs/specs/systemvm-packages.lock.yaml
      - systemvm/**
      - scripts/systemvm/**
      - scripts/macos/build-vmlauncher.sh
      - launcher/**
      - packaging/macos/vesper-vmlauncher.entitlements
      - src/systemvm.rs
      - src/bin/systemvmctl.rs
      - Makefile
      - .github/workflows/systemvm-image.yml
  push:
    branches: [main]
    paths:
      - docs/specs/systemvm-image.lock.yaml
      - scripts/systemvm/**
      - scripts/macos/build-vmlauncher.sh
      - launcher/**
      - packaging/macos/vesper-vmlauncher.entitlements
      - src/systemvm.rs
      - src/bin/systemvmctl.rs
      - Makefile
      - .github/workflows/systemvm-image.yml

jobs:
  reproducible-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache pinned image archive
        uses: actions/cache@v4
        with:
          path: build/systemvm/cache
          key: systemvm-image-${{ hashFiles('docs/specs/systemvm-image.lock.yaml') }}

      - name: Install bsdtar (reads ISO 9660)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools

      - name: Setup Go (the overlay carries the cross-built containerd shim)
        uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
          cache-dependency-path: shim/go.sum

      - name: systemvm unit tests
        run: cargo test systemvm

      - name: Reliability report assembler self-test
        run: python3 -I scripts/systemvm/reliability_report.py --self-test

      - name: Cache pinned guest packages
        uses: actions/cache@v4
        with:
          path: build/systemvm/cache/apks
          key: systemvm-packages-${{ hashFiles('docs/specs/systemvm-packages.lock.yaml') }}

      - name: Fetch and verify pinned image (digests + expected image_id)
        run: make systemvm-fetch

      - name: Fetch pinned packages and build the overlay initramfs
        run: make systemvm-overlay

      - name: Overlay build is deterministic
        run: |
          first="$(sha256sum build/systemvm/initramfs-vesper | cut -d' ' -f1)"
          bash scripts/systemvm/build-overlay.sh > /dev/null
          second="$(sha256sum build/systemvm/initramfs-vesper | cut -d' ' -f1)"
          echo "first=${first} second=${second}"
          test "${first}" = "${second}"

      - name: Re-verify fetched artifacts into the manifest
        run: make systemvm-build

      - name: Generate NAT-default launch config from the lock
        run: make systemvm-launch-config

      - name: Manifest image_id equals the pinned expected_image_id
        run: |
          expected="$(grep '^expected_image_id:' docs/specs/systemvm-image.lock.yaml | awk '{print $2}')"
          actual="$(python3 -c 'import json;print(json.load(open("build/systemvm/image-manifest.json"))["image_id"])')"
          echo "expected=${expected} actual=${actual}"
          test "${expected}" = "${actual}"

      - name: Upload manifest and launch config
        uses: actions/upload-artifact@v4
        with:
          name: systemvm-image-${{ github.sha }}
          path: |
            build/systemvm/image-manifest.json
            build/systemvm/launch-config.json
            build/systemvm/localhost.apkovl.tar.gz

  launcher-build:
    # Virtualization.framework helper: build and ad-hoc sign on macOS. GitHub's macOS runners are
    # themselves VMs without nested virtualization, so this job proves the build and signature, not a boot.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and sign vesper-vmlauncher
        run: make vmlauncher-build

      - name: Launcher runs and rejects a missing config
        run: |
          build/vmlauncher/vesper-vmlauncher --help
          if build/vmlauncher/vesper-vmlauncher --config /nonexistent.json; then exit 1; fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Host capabilities and backend selection do not crash on GitHub's M-series runner (GH #17)
        run: |
          build/vmlauncher/vesper-vmlauncher --host-capabilities
          cargo run -q --bin systemvmctl -- backend-select --launcher build/vmlauncher/vesper-vmlauncher
          if cargo run -q --bin systemvmctl -- backend-select --launcher build/vmlauncher/vesper-vmlauncher --policy require; then
            echo "require policy accepted: this runner supports nested virtualization"
          else
            echo "require policy refused with diagnostics (expected on M1/M2 runners)"
          fi

      - name: Entitlement plists are valid
        run: make validate-entitlements
