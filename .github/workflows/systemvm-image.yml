name: System VM Image

on:
  pull_request:
    paths:
      - docs/specs/systemvm-image.lock.yaml
      - docs/specs/systemvm-packages.lock.yaml
      - systemvm/**
      - scripts/systemvm/**
      - scripts/macos/build-vmlauncher.sh
      - scripts/macos/share-watch-selftest.sh
      - launcher/**
      - packaging/macos/vesper-vmlauncher.entitlements
      - src/systemvm.rs
      - src/bin/systemvmctl.rs
      - third_party/unfs3/**
      - Makefile
      - .github/workflows/systemvm-image.yml
  push:
    branches: [main]
    paths:
      - docs/specs/systemvm-image.lock.yaml
      - docs/specs/systemvm-packages.lock.yaml
      - systemvm/**
      - scripts/systemvm/**
      - scripts/macos/build-vmlauncher.sh
      - scripts/macos/share-watch-selftest.sh
      - launcher/**
      - packaging/macos/vesper-vmlauncher.entitlements
      - src/systemvm.rs
      - src/bin/systemvmctl.rs
      - third_party/unfs3/**
      - Makefile
      - .github/workflows/systemvm-image.yml

jobs:
  unfs3-reproducible:
    # The overlay ships a patched unfsd binary (third_party/unfs3, D-044). This rebuilds it from the pinned source,
    # patches and container on a native arm64 runner and fails unless the result is byte for byte the shipped one.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild unfsd and compare with the shipped binary
        run: bash scripts/systemvm/build-unfs3.sh

  reproducible-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0" # keep equal to rust-toolchain.toml (TD-009)
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache pinned image archive
        uses: actions/cache@v4
        with:
          path: build/systemvm/cache
          key: systemvm-image-${{ hashFiles('docs/specs/systemvm-image.lock.yaml') }}

      - name: Install bsdtar (reads ISO 9660)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools

      - name: Setup Go (the overlay carries the cross-built containerd shim)
        uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
          cache-dependency-path: shim/go.sum

      - name: systemvm unit tests
        run: cargo test systemvm

      - name: Reliability report assembler self-test
        run: python3 -I scripts/systemvm/reliability_report.py --self-test

      - name: Share notification sink self-test
        run: make share-notify-selftest

      - name: Cache pinned guest packages
        uses: actions/cache@v4
        with:
          path: build/systemvm/cache/apks
          key: systemvm-packages-${{ hashFiles('docs/specs/systemvm-packages.lock.yaml') }}

      - name: Fetch and verify pinned image (digests + expected image_id)
        run: make systemvm-fetch

      - name: Fetch pinned packages and build the overlay initramfs
        run: make systemvm-overlay

      - name: Overlay build is deterministic
        run: |
          first="$(sha256sum build/systemvm/initramfs-vesper | cut -d' ' -f1)"
          bash scripts/systemvm/build-overlay.sh > /dev/null
          second="$(sha256sum build/systemvm/initramfs-vesper | cut -d' ' -f1)"
          echo "first=${first} second=${second}"
          test "${first}" = "${second}"

      - name: Re-verify fetched artifacts into the manifest
        run: make systemvm-build

      - name: Generate NAT-default launch config from the lock
        run: make systemvm-launch-config

      - name: Manifest image_id equals the pinned expected_image_id
        run: |
          expected="$(grep '^expected_image_id:' docs/specs/systemvm-image.lock.yaml | awk '{print $2}')"
          actual="$(python3 -c 'import json;print(json.load(open("build/systemvm/image-manifest.json"))["image_id"])')"
          echo "expected=${expected} actual=${actual}"
          test "${expected}" = "${actual}"

      - name: Upload manifest and launch config
        uses: actions/upload-artifact@v4
        with:
          name: systemvm-image-${{ github.sha }}
          path: |
            build/systemvm/image-manifest.json
            build/systemvm/launch-config.json
            build/systemvm/localhost.apkovl.tar.gz
          # The image is rebuilt from the commit and checked reproducible, so old copies are not evidence;
          # a short retention keeps the repository under its artifact quota (2026-11-12).
          retention-days: 7

  launcher-build:
    # Virtualization.framework helper: build and ad-hoc sign on macOS. GitHub's macOS runners are
    # themselves VMs without nested virtualization, so this job proves the build and signature, not a boot.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and sign vesper-vmlauncher
        run: make vmlauncher-build

      - name: The launcher's seatbelt profile refuses what it never needs, signed with the hardened runtime (ADR 0012)
        run: |
          bash scripts/macos/launcher-sandbox-probe.sh
          # Read whole first: with pipefail, grep -q closing the pipe early would fail codesign with SIGPIPE.
          sig="$(codesign --display --verbose build/vmlauncher/vesper-vmlauncher 2>&1)"
          case "$sig" in *flags=*runtime*) echo "vesper-vmlauncher: hardened runtime" ;; *) echo "not signed with the hardened runtime: $sig"; exit 1 ;; esac

      - name: Launcher runs and rejects a missing config
        run: |
          build/vmlauncher/vesper-vmlauncher --help
          if build/vmlauncher/vesper-vmlauncher --config /nonexistent.json; then exit 1; fi

      - name: Share watcher self-test (FSEvents dry run, no VM)
        run: make share-watch-selftest

      - name: The launcher decodes every launch-config field as written (TD-044)
        run: make launcher-config-contract

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0" # keep equal to rust-toolchain.toml (TD-009)
          components: rustfmt, clippy

      - name: Host capabilities and backend selection do not crash on GitHub's M-series runner (GH #17)
        run: |
          build/vmlauncher/vesper-vmlauncher --host-capabilities
          cargo run -q --bin systemvmctl -- backend-select --launcher build/vmlauncher/vesper-vmlauncher
          if cargo run -q --bin systemvmctl -- backend-select --launcher build/vmlauncher/vesper-vmlauncher --policy require; then
            echo "require policy accepted: this runner supports nested virtualization"
          else
            echo "require policy refused with diagnostics (expected on M1/M2 runners)"
          fi

      - name: vesperd's and vesper-proxy's seatbelt profiles refuse what they never need, signed with the hardened runtime (ADR 0012)
        run: |
          # Build once, sign, then run the built tests directly: a second cargo run can relink a binary and replace
          # its signature with the linker's (seen on CI, 2026-11-22).
          exes="$(cargo test -q --test proxy_sandbox --test vesperd_sandbox --no-run --message-format=json | python3 -I -c 'import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get("executable") and m.get("target", {}).get("name") in ("proxy_sandbox", "vesperd_sandbox"): print(m["executable"])')"
          [ "$(printf '%s\n' "$exes" | grep -c .)" = 2 ] || { echo "expected two test executables: $exes"; exit 1; }
          bash scripts/macos/sign.sh debug vesperd vesper-proxy
          while read -r exe; do "$exe" </dev/null; done <<<"$exes"
          for bin in vesperd vesper-proxy; do
            # Read whole first: with pipefail, grep -q closing the pipe early would fail codesign with SIGPIPE.
            sig="$(codesign --display --verbose "target/debug/$bin" 2>&1)"
            case "$sig" in *flags=*runtime*) echo "$bin: hardened runtime" ;; *) echo "$bin not signed with the hardened runtime: $sig"; exit 1 ;; esac
          done

      - name: Entitlement plists are valid and hold exactly the approved keys (TD-010)
        run: make validate-entitlements

      - name: The launcher's signature verifies and carries exactly its plist's entitlements (TD-010)
        run: |
          codesign --verify --strict --verbose=2 build/vmlauncher/vesper-vmlauncher
          codesign --display --entitlements :- build/vmlauncher/vesper-vmlauncher > /tmp/signed.plist
          python3 -I - /tmp/signed.plist packaging/macos/vesper-vmlauncher.entitlements <<'PY'
          import plistlib, sys
          signed, want = (plistlib.load(open(p, "rb")) for p in sys.argv[1:3])
          if signed != want:
              sys.exit(f"signed entitlements {signed} differ from the plist {want}")
          print(f"signed entitlements match the plist: {sorted(signed)}")
          PY
