name: Rust Tests

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - third_party/**
      - docs/generated/**
      - docs/specs/*.yaml
      - packaging/**
      - scripts/ci/**
      - scripts/licenses/**
      - rust-toolchain.toml
      - THIRD_PARTY_NOTICES.md
      - shim/go.mod
      - shim/go.sum
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - third_party/**
      - docs/generated/**
      - docs/specs/*.yaml
      - packaging/**
      - scripts/ci/**
      - scripts/licenses/**
      - rust-toolchain.toml
      - THIRD_PARTY_NOTICES.md
      - shim/go.mod
      - shim/go.sum
      - .github/workflows/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0" # keep equal to rust-toolchain.toml (TD-009)
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Go (the notices list the shim's modules)
        uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
          cache-dependency-path: shim/go.sum

      - name: Format and clippy (TD-006)
        run: make lint

      - name: Build all binaries
        run: make build

      - name: Full test suite
        run: cargo test

      - name: Surface stub matrix is fresh
        run: make surface-matrix-check

      - name: Behavior matrix is fresh
        run: make behavior-matrix-check

      - name: Entitlement plists are valid
        run: make validate-entitlements

      - name: Third-party notices list every linked crate and Go module
        run: make third-party-notices-check
