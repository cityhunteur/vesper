name: ctr Conformance

on:
  pull_request:
    paths:
      - docs/specs/ctr-conformance-baseline.json
      - docs/specs/design-v0.baselines.lock.yaml
      - scripts/systemvm/ctr_conformance_report.py
      - .github/workflows/ctr-conformance.yml
  push:
    branches: [main]
    paths:
      - docs/specs/ctr-conformance-baseline.json
      - docs/specs/design-v0.baselines.lock.yaml
      - scripts/systemvm/ctr_conformance_report.py
      - .github/workflows/ctr-conformance.yml

jobs:
  validate-and-publish:
    # The suites need a booted System VM on an M3+ Mac (TD-005); CI re-validates the committed capture
    # against the current baseline lock and publishes it as an artifact.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report assembler self-test
        run: python3 -I scripts/systemvm/ctr_conformance_report.py --self-test

      - name: Validate the committed capture against the lock
        run: python3 -I scripts/systemvm/ctr_conformance_report.py --validate docs/specs/ctr-conformance-baseline.json --lock docs/specs/design-v0.baselines.lock.yaml

      - name: Upload the ctr conformance report
        uses: actions/upload-artifact@v4
        with:
          name: ctr-conformance-${{ github.sha }}
          path: docs/specs/ctr-conformance-baseline.json
          if-no-files-found: error
